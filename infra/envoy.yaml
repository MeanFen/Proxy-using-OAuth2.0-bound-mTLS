static_resources:
  listeners:
    - name: ingress_edge
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 443

      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager

                stat_prefix: ingress_http
                generate_request_id: true

                # Xóa XFCC do Client tự gửi và tạo lại từ cert mTLS thật.
                forward_client_cert_details: SANITIZE_SET

                set_current_client_cert_details:
                  subject: true
                  cert: true

                route_config:
                  name: local_route

                  virtual_hosts:
                    - name: local_service
                      domains:
                        - "*"

                      routes:
                        # Login yêu cầu mTLS Client → Envoy nhưng chưa có JWT,
                        # nên không áp dụng ext_authz.
                        - match:
                            prefix: "/auth/login"
                          route:
                            cluster: auth_service_cluster
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true

                        # Route debug /verify đi thẳng tới Auth Service.
                        # Tắt ext_authz để tránh Auth kiểm tra chính request gọi Auth.
                        - match:
                            prefix: "/verify"
                          route:
                            cluster: auth_service_cluster
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true

                        # API công khai không yêu cầu JWT.
                        - match:
                            prefix: "/api/public"
                          route:
                            cluster: resource_api_cluster
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true

                        # API bảo vệ bắt buộc qua ext_authz.
                        - match:
                            prefix: "/api/protected"
                          route:
                            cluster: resource_api_cluster
                            timeout: 15s

                        # Đường dẫn khác trả 404.
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: "Not Found\n"
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true

                http_filters:
                  # ext_authz phải đứng trước router.
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3

                      # Auth Service lỗi thì request phải bị chặn.
                      failure_mode_allow: false

                      http_service:
                        server_uri:
                          uri: "https://auth-service:8443"
                          cluster: auth_service_cluster
                          timeout: 2s

                        # GET /api/protected được kiểm tra tại:
                        # GET /verify/api/protected
                        path_prefix: "/verify"

                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: "authorization"
                              - exact: "x-forwarded-client-cert"
                              - exact: "x-request-id"
                              - exact: "content-type"

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

          # Downstream mTLS: Client → Envoy.
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext

              require_client_certificate: true

              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: "/etc/envoy/certs/server.crt"
                    private_key:
                      filename: "/etc/envoy/certs/server.key"

                validation_context:
                  trusted_ca:
                    filename: "/etc/envoy/certs/root-ca.crt"

  clusters:
    # Upstream mTLS: Envoy → Auth Service.
    - name: auth_service_cluster
      connect_timeout: 2s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN

      load_assignment:
        cluster_name: auth_service_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: auth-service
                      port_value: 8443

      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext

          # SNI gửi tới Auth Service.
          sni: auth-service

          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: TLSv1_2
              tls_maximum_protocol_version: TLSv1_3

            # Envoy gửi client certificate này cho Auth Service.
            tls_certificates:
              - certificate_chain:
                  filename: "/etc/envoy/upstream-tls/envoy-upstream.crt"
                private_key:
                  filename: "/etc/envoy/upstream-tls/envoy-upstream.key"

            # Envoy xác minh certificate của Auth Service.
            validation_context:
              trusted_ca:
                filename: "/etc/envoy/upstream-tls/service-ca.crt"

              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher:
                    exact: "auth-service"

    # Envoy kết nối Resource API bằng HTTPS/mTLS nội bộ.
    - name: resource_api_cluster
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN

      load_assignment:
        cluster_name: resource_api_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: resource-api
                      port_value: 8443

      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: "resource-api"

          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: TLSv1_2
              tls_maximum_protocol_version: TLSv1_3

            tls_certificates:
              - certificate_chain:
                  filename: /etc/envoy/upstream-tls/envoy-upstream.crt
                private_key:
                  filename: /etc/envoy/upstream-tls/envoy-upstream.key

            validation_context:
              trusted_ca:
                filename: /etc/envoy/upstream-tls/service-ca.crt

              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher:
                    exact: "resource-api"
